objective: "Review and harden Kujo Relay for enterprise readiness, universal usefulness, presentation, and truthful evidence."
checklist_file: ""
max_iterations: 8
max_no_progress: 2
max_consecutive_failures: 3

allowed_actions:
  - read_files
  - edit_files
  - run_tests
  - commit_local_changes

blocked_actions:
  - deploy
  - destructive_cleanup
  - production_config_change

eval_gates:
  - id: relay_acceptance
    command: "bash tests/relay_acceptance.sh"
    required: true

commit:
  enabled: false
  strategy: small_meaningful
  push: false

memory:
  enabled: true
  provider: strata
  project: "Agent Notes"
  mode: consolidate
  retrieval_tests: true
