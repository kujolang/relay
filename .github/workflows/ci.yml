name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_call:

permissions:
  contents: read

jobs:
  release-gate:
    name: release-gate (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout Relay
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: relay
          fetch-depth: 0
      - name: Checkout Kujo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kujolang/kujo
          ref: 9b77dce592047121cb71066629836ad89252f3ce
          path: kujo
          token: ${{ secrets.KUJO_ECOSYSTEM_TOKEN || github.token }}
      - name: Checkout AI SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kujolang/ai-sdk
          ref: d3c6def0f7844f8b42bd92d3b176e80283af8e79
          path: ai-sdk
          token: ${{ secrets.KUJO_ECOSYSTEM_TOKEN || github.token }}
      - name: Checkout Agents SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kujolang/agents-sdk
          ref: e92a61ec1df21c89ae26f411838b4669405a0765
          path: agents-sdk
          token: ${{ secrets.KUJO_ECOSYSTEM_TOKEN || github.token }}
      - name: Checkout Kujo Agents
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kujolang/kujo-agents
          ref: f0c95b66fbc74057481ef228961eb6e69ff8886a
          path: kujo-agents
          token: ${{ secrets.KUJO_ECOSYSTEM_TOKEN || github.token }}
      - name: Checkout Watchdog
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kujolang/watchdog
          ref: 7c46cd0bf1680d037c24506be4ed0a2405a9841f
          path: watchdog
          token: ${{ secrets.KUJO_ECOSYSTEM_TOKEN || github.token }}
      - name: Checkout PackWrite
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kujolang/packwrite
          ref: 0cb9487e4c02218bb4a18efe68b8a0c22998f715
          path: packwrite
          token: ${{ secrets.KUJO_ECOSYSTEM_TOKEN || github.token }}
      - name: Checkout RunLedger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kujolang/runledger
          ref: 5cf186c9b56b540970f75e33a06f50d3dac833a8
          path: runledger
          token: ${{ secrets.KUJO_ECOSYSTEM_TOKEN || github.token }}
      - name: Checkout ChangeBucket
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kujolang/changebucket
          ref: 373ac51a572bd3bb0510ac718ac1bab065c84735
          path: changebucket
          token: ${{ secrets.KUJO_ECOSYSTEM_TOKEN || github.token }}
      - name: Checkout Eval
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kujolang/eval
          ref: dce9d030a3547803dab876b404c44c25b247dde1
          path: eval
          token: ${{ secrets.KUJO_ECOSYSTEM_TOKEN || github.token }}
      - name: Checkout Kennel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kujolang/kennel
          ref: 6df043c3ba0bde4445cc8f8f7d4c01c60c9c6d7e
          path: kennel
          token: ${{ secrets.KUJO_ECOSYSTEM_TOKEN || github.token }}
      - name: Checkout ShipCheck
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kujolang/shipcheck
          ref: 2768e3040e766b0befd354db4427afc4c7a81899
          path: shipcheck
          token: ${{ secrets.KUJO_ECOSYSTEM_TOKEN || github.token }}

      - name: Setup pinned Rust toolchain action
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Build pinned Kujo runtime
        shell: bash
        run: cargo build --release --locked --manifest-path kujo/Cargo.toml --bin kujo

      - name: Run complete Relay release gate
        working-directory: relay
        shell: bash
        env:
          KUJO_BIN: ${{ github.workspace }}/kujo/target/release/kujo
          KUJO_SOURCE_ROOT: ${{ github.workspace }}/kujo
          KUJO_AI_SDK_PATH: ${{ github.workspace }}/ai-sdk
          KUJO_AGENTS_PATH: ${{ github.workspace }}/kujo-agents
          RELAY_WATCHDOG_ROOT: ${{ github.workspace }}/watchdog
          RELAY_PACKWRITE_ROOT: ${{ github.workspace }}/packwrite
          RELAY_RUNLEDGER_ROOT: ${{ github.workspace }}/runledger
          RELAY_CHANGEBUCKET_ROOT: ${{ github.workspace }}/changebucket
          RELAY_EVAL_ENTRY: ${{ github.workspace }}/eval/main.kujo
          KENNEL_ROOT: ${{ github.workspace }}/kennel
          SHIPCHECK_ROOT: ${{ github.workspace }}/shipcheck
        run: bash scripts/release_gate.sh

      - name: Build candidate artifacts
        working-directory: relay
        shell: bash
        env:
          RELAY_SOURCE_CHECK_RESULT: passed
          RELAY_CLI_CONTRACT_RESULT: passed
          RELAY_ACCEPTANCE_RESULT: passed
          RELAY_SCHEMA_RESULT: passed
          RELAY_MARKDOWN_RESULT: passed
          RELAY_METADATA_RESULT: passed
          RELAY_KENNEL_RESULT: passed
          RELAY_SHIPCHECK_RESULT: passed-16-of-16
          RELAY_WORKCELL_RESULT: pending-exact-candidate-release-workflow
          RELAY_LIVE_PROVIDER_RESULT: blocked-approval-or-credentials-required
          RELAY_PLATFORM_LINUX_X86_64: ${{ matrix.platform == 'linux-x86_64' && 'passed' || 'pending-other-matrix-job' }}
          RELAY_PLATFORM_MACOS_X86_64: ${{ matrix.platform == 'macos-x86_64' && 'passed' || 'pending-other-matrix-job' }}
          RELAY_PLATFORM_MACOS_ARM64: ${{ matrix.platform == 'macos-arm64' && 'passed' || 'pending-other-matrix-job' }}
        run: bash scripts/build_release_artifacts.sh "${RUNNER_TEMP}/relay-release" "$GITHUB_SHA"

      - name: Upload platform evidence and candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: relay-${{ github.sha }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/relay-release/
          if-no-files-found: error
          retention-days: 30
